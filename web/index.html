<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>"
    />
    <title>Animal Tracker Map</title>
    <!-- Start connecting to the map tile server while the page loads. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  </head>
  <body>
    <aside id="sidebar" class="sidebar">
      <button id="sheet-handle" class="sheet-handle" type="button">
        <span aria-hidden="true"></span>
      </button>
      <header class="brand">
        <h1><span aria-hidden="true">🐾</span> Animal Tracker</h1>
        <p>Where the world's best-loved animals live and roam</p>
      </header>
      <fieldset id="layer-toggles" class="layer-toggles">
        <legend class="visually-hidden">Show on the map</legend>
        <label class="switch">
          <input type="checkbox" value="sightings" checked />
          <span class="switch-track" aria-hidden="true"></span>
          <span>Sightings <span class="switch-key switch-key-dot" aria-hidden="true"></span></span>
        </label>
        <label class="switch">
          <input type="checkbox" value="tracks" checked />
          <span class="switch-track" aria-hidden="true"></span>
          <span>Migration tracks <span class="switch-key switch-key-line" aria-hidden="true"></span></span>
        </label>
        <div id="timeline"></div>
      </fieldset>
      <div class="near-me">
        <button id="near-me" class="near-me-button" type="button">📍 What lives near me?</button>
        <section id="nearby" class="nearby" aria-label="Animals recorded near you" hidden></section>
      </div>
      <div id="species-picker" class="species-picker"></div>
      <section id="sources" class="sources" hidden>
        <h2>Track data</h2>
        <ul></ul>
      </section>
    </aside>
    <main class="map-area">
      <div id="map"></div>
      <button
        id="sidebar-toggle"
        class="sidebar-toggle panel"
        type="button"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <span aria-hidden="true">‹</span>
        <span class="visually-hidden">Hide the animal list</span>
      </button>
      <button id="share" class="share-button panel" type="button" hidden>🔗 Share</button>
      <section id="welcome" class="welcome panel" aria-labelledby="welcome-title">
        <h2 id="welcome-title">Pick an animal to start exploring</h2>
        <p>See where each animal has been spotted, and follow tracked animals on their journeys.</p>
        <div id="welcome-presets" class="welcome-presets"></div>
      </section>
      <p id="map-status" class="map-status panel" role="status">Loading map…</p>
      <aside id="profile" class="profile panel" hidden></aside>
      <ul id="legend" class="legend panel" aria-label="Animals on the map" hidden></ul>
      <div id="playback" class="playback panel" hidden>
        <button id="play-tracks" type="button">▶ Play journeys</button>
        <div class="playback-bar" aria-hidden="true"><span id="playback-progress"></span></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
