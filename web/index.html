<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Tracker Map</title>
  </head>
  <body>
    <aside class="sidebar">
      <h1>Animal Tracker Map</h1>
      <fieldset id="layer-toggles" class="layer-toggles">
        <legend>Show</legend>
        <label><input type="checkbox" value="sightings" checked /> Sightings (dots)</label>
        <label><input type="checkbox" value="tracks" checked /> Migration tracks (lines)</label>
      </fieldset>
      <div id="species-picker"></div>
      <section id="sources" class="sources" hidden>
        <h2>Track data</h2>
        <ul></ul>
      </section>
    </aside>
    <main class="map-area">
      <div id="map"></div>
      <p id="map-status" class="map-status" role="status" hidden></p>
      <ul id="legend" class="legend" aria-label="Species on the map" hidden></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
